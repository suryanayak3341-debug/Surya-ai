

<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Surya AI - आपका पर्सनल AI साथी</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #101322;

  color: white;

}

header {

  padding: 20px;

  text-align: center;

  background: #191f38;

  border-bottom: 1px solid #333b5c;

}

header h1 { margin: 0; color: #a99cff; }

header p { color: #c7c9dc; }

#chatContainer {

  padding: 16px;

  max-width: 700px;

  margin: auto;

  min-height: 55vh;

}

.message { display: flex; margin: 12px 0; }

.message.user { justify-content: flex-end; }

.message.ai { justify-content: flex-start; }

.message-bubble {

  padding: 12px 15px;

  border-radius: 16px;

  max-width: 85%;

  overflow-wrap: anywhere;

  line-height: 1.5;

}

.user .message-bubble {

  background: #6655d9;

  color: white;

}

.ai .message-bubble {

  background: #242a43;

  color: white;

}

#chatForm {

  display: flex;

  gap: 8px;

  padding: 12px;

  max-width: 700px;

  margin: 0 auto;

  position: sticky;

  bottom: 0;

  background: #101322;

}

#chatInput {

  flex: 1;

  min-width: 0;

  padding: 14px;

  border-radius: 12px;

  border: 1px solid #555c7c;

  background: #1d233b;

  color: white;

  font-size: 16px;

}

#sendButton {

  border: 0;

  border-radius: 12px;

  padding: 0 18px;

  background: #7967f5;

  color: white;

  font-size: 16px;

  font-weight: bold;

}

#sendButton:disabled { opacity: 0.6; }

.note {

  text-align: center;

  color: #aeb3cb;

  font-size: 12px;

  padding: 10px;

}

</style>

</head>

<body>

<header>

  <h1>☀️ Surya AI</h1>

  <p>आपका पर्सनल AI साथी</p>

</header>

<div id="chatContainer">

  <div class="message ai">

    <div class="message-bubble">

      नमस्ते भाई! 🙏 मैं Surya AI हूँ। मुझे मैसेज भेजकर देखिए।

    </div>

  </div>

</div>

<form id="chatForm">

  <input id="chatInput" type="text"

    placeholder="यहाँ मैसेज लिखें..."

    autocomplete="off" required>

  <button id="sendButton" type="submit">Send ➤</button>

</form>

<div class="note">Surya AI • Demo Chat</div>

<script>

const chatInput = document.getElementById("chatInput");

const chatContainer = document.getElementById("chatContainer");

const chatForm = document.getElementById("chatForm");

const sendButton = document.getElementById("sendButton");

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  const bubble = document.createElement("div");

  bubble.className = "message-bubble";

  bubble.textContent = text;

  message.appendChild(bubble);

  chatContainer.appendChild(message);

  window.scrollTo(0, document.body.scrollHeight);

}

function getReply(message) {

  const q = message.toLowerCase();

  if (q.includes("नमस्ते") || q.includes("hello") ||

      q.includes("hi") || q.includes("हाय")) {

    return "नमस्ते भाई! ☀️ बताइए, मैं आपकी क्या मदद करूँ?";

  }

  if (q.includes("नाम") || q.includes("कौन हो")) {

    return "मेरा नाम Surya AI है। मैं आपका पर्सनल AI साथी हूँ।";

  }

  if (q.includes("शायरी") || q.includes("shayari")) {

    return "हौसले बुलंद हों तो रास्ते बन जाते हैं,\nमेहनत करने वालों के सपने सच हो जाते हैं! ✨";

  }

  if (q.includes("फोटो") || q.includes("photo") ||

      q.includes("prompt")) {

    return "मैं आपके लिए फोटो एडिटिंग का प्रॉम्प्ट बनाने में मदद कर सकता हूँ। अपनी फोटो का आइडिया बताइए।";

  }

  return "आपका मैसेज मिल गया! 😊 अभी मैं डेमो मोड में हूँ। असली AI जवाबों के लिए मुझे AI सेवा से जोड़ना होगा।";

}

chatForm.addEventListener("submit", function(event) {

  event.preventDefault();

  const text = chatInput.value.trim();

  if (!text) return;

  addMessage(text, "user");

  chatInput.value = "";

  sendButton.disabled = true;

  setTimeout(function() {

    addMessage(getReply(text), "ai");

    sendButton.disabled = false;

    chatInput.focus();

  }, 400);

});

</script>

</body>

</html>
